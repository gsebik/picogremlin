# PicoGremlin hardware-test OpenOCD setup for the RP2350 target.
# Uses only core 0 (cm0) to keep debug/test control simple.
# Adapter speed kept at 250 kHz: higher speeds hit a PIO SWD bulk-transfer
# desync (see HARDWARE_VALIDATION.md, BUG-002).
source [find interface/cmsis-dap.cfg]
# Select the adapter by serial when PICOGREMLIN_SERIAL is set in the
# environment; otherwise OpenOCD uses the only connected CMSIS-DAP device.
if { [info exists ::env(PICOGREMLIN_SERIAL)] && $::env(PICOGREMLIN_SERIAL) ne "" } {
    adapter serial $::env(PICOGREMLIN_SERIAL)
}
adapter speed 250
set USE_CORE { cm0 }
source [find target/rp2350.cfg]